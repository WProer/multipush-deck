<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">MultiPush Deck application icon</title>
  <desc id="description">
    A geometric M formed by three green paths converging from separate nodes.
  </desc>

  <defs>
    <linearGradient
      id="surface"
      gradientUnits="userSpaceOnUse"
      x1="160"
      y1="104"
      x2="864"
      y2="920"
    >
      <stop offset="0" stop-color="#10211D" />
      <stop offset="1" stop-color="#0A1412" />
    </linearGradient>

    <linearGradient
      id="route"
      gradientUnits="userSpaceOnUse"
      x1="232"
      y1="292"
      x2="792"
      y2="812"
    >
      <stop offset="0" stop-color="#34D399" />
      <stop offset="0.52" stop-color="#10B981" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>

    <linearGradient
      id="routeCenter"
      gradientUnits="userSpaceOnUse"
      x1="512"
      y1="560"
      x2="512"
      y2="824"
    >
      <stop offset="0" stop-color="#10B981" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>

    <filter
      id="glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#surface)" />
  <rect
    x="34"
    y="34"
    width="956"
    height="956"
    rx="202"
    fill="none"
    stroke="#10B981"
    stroke-opacity="0.16"
    stroke-width="8"
  />

  <g
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M232 748V292L512 582L792 292V748"
      stroke="#10B981"
      stroke-opacity="0.28"
      stroke-width="148"
      filter="url(#glow)"
    />

    <path
      d="M232 748V292L512 582"
      stroke="url(#route)"
      stroke-width="112"
    />
    <path
      d="M512 582L792 292V748"
      stroke="url(#route)"
      stroke-width="112"
    />
    <path
      d="M512 582V812"
      stroke="url(#routeCenter)"
      stroke-width="112"
    />
  </g>

  <g fill="#0A1412" stroke="#10B981" stroke-width="12">
    <circle cx="232" cy="748" r="18" />
    <circle cx="792" cy="748" r="18" />
    <circle cx="512" cy="812" r="18" />
  </g>

  <circle
    cx="512"
    cy="582"
    r="29"
    fill="#0A1412"
    stroke="#34D399"
    stroke-width="15"
  />
</svg>
